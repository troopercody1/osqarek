plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC          # search only
      - TV
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEB
    oauth:
      enabled: true
      refreshToken: ""        # fill after the first login, see below
      # skipInitialization: true  # uncomment once refreshToken is set
    # Optional, helps with "confirm you're not a bot":
    # pot:
    #   token: "..."
    #   visitorData: "..."

logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includePayload: false
    includeQueryString: true
